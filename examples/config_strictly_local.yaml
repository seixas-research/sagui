# Strictly local equivariant potential (Allegro-like): no message passing, so
# the receptive field stays at exactly one cutoff however deep the model is.
# Run with:  sagui-train examples/config_strictly_local.yaml

model:
  type: strictly_local
  r_max: 5.0
  lmax: 2
  channels: 32
  num_layers: 2         # depth adds body order, NOT receptive field
  latent_dim: 64        # width of the invariant (scalar) track
  scalar_mlp_hidden: [64, 64]
  num_radial_basis: 8
  # zbl_cutoff: 1.8              # parameter-free nuclear core; stops MD collapsing
  # cross_degree_invariants: true  # adds the (1,1)->2 scalar; needs lmax >= 2

data:
  train_file: examples/toy.xyz
  valid_fraction: 0.2

training:
  epochs: 100
  batch_size: 8
  learning_rate: 0.01
  energy_weight: 1.0
  forces_weight: 100.0
  # stress_weight: 10.0        # needs stress labels; adds one backward per step
  # huber_delta: 0.01          # shared fallback; an ABSOLUTE threshold
  # huber_delta_energy: 0.3    # per-term is what you usually want: set each from
  # huber_delta_forces: 0.05   # the RMS residual of that label, since per-atom
  # huber_delta_stress: 0.01   # energies, forces and stresses differ by orders
  # weight_switch: 0.5             # stage two at 50% of the epochs: swap the E/F
  # weight_switch_energy_weight: 1000.0  # weights (or set them explicitly) and scale the
  # weight_switch_forces_weight: 10.0    # learning rate by weight_switch_lr_factor (default 0.1)
  ema_decay: 0.99
  device: auto
  default_dtype: float32
  output_dir: runs
  name: toy-strictly-local
